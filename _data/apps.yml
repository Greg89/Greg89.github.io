# One entry per application. Each app also needs a folder under /apps/<id>/
# containing index.md, privacy.md, terms.md and refunds.md.
# Omit url and payments until live URLs and paid plans are confirmed.
housepoints:
  name: HousePoints
  tagline: Team recognition through points, houses, and shared achievements.
  description: >-
    HousePoints is an organization-scoped recognition app. Members award points
    to teammates, contributions roll up to house totals, and activity and reports
    stay within each organization.
  repo: https://github.com/Greg89/HousePoints
  status: In development
  tech: [TypeScript, Next.js, Fastify, Prisma, PostgreSQL, Auth0]
  last_updated: 2026-11-01
  data_collected:
    - Account and sign-in information managed through Auth0
    - Organization membership, house assignments, seasons, and invitations
    - Points awarded, recognition activity, and reporting records
    - Operational logs used to troubleshoot and maintain the service

curateds:
  name: CurateDS
  tagline: A flexible catalog for the things you collect.
  description: >-
    CurateDS helps collectors organize books, vinyl, board games, tools, and other
    personal collections. Custom attributes, tags, locations, search, and saved
    views let each catalog fit the collection rather than the other way around.
  repo: https://github.com/Greg89/CurateDS
  status: In development
  tech: [C#, ASP.NET Core, React, TypeScript, PostgreSQL, Auth0]
  last_updated: 2026-11-01
  data_collected:
    - Account and sign-in information managed through Auth0
    - Collections, catalog items, custom attributes, tags, and locations you submit
    - Saved views and item activity history
    - Operational logs used to troubleshoot and maintain the service

normaize:
  name: Normaize
  tagline: Tools to normalize, compare, analyze, and visualize your data.
  description: >-
    Normaize is a data toolbox with a React client and an ASP.NET Core API.
    It brings dataset uploads and previews, data cleaning and normalization,
    comparisons, analysis, and visualizations into one workflow.
  repo: https://github.com/Greg89/normaize-client
  status: In development
  tech: [C#, ASP.NET Core, React, TypeScript, PostgreSQL, Auth0]
  last_updated: 2026-11-01
  data_collected:
    - Account and sign-in information managed through Auth0
    - Uploaded datasets and their metadata
    - Normalization jobs, analysis results, and saved preferences
    - Operational logs used to troubleshoot and maintain the service
